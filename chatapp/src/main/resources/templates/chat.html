<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0">

    <title>EchoVerse Chat</title>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
          rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{

            height:100vh;

            background:
                    linear-gradient(
                            135deg,
                            #020617,
                            #0f172a,
                            #111827
                    );

            overflow:hidden;

        }

        .chat-container{

            width:100%;
            height:100vh;

            display:flex;
            flex-direction:column;

        }

        /* HEADER */

        .header{

            height:90px;

            padding:0 30px;

            display:flex;
            justify-content:space-between;
            align-items:center;

            background:
                    rgba(255,255,255,0.05);

            backdrop-filter:blur(15px);

            border-bottom:
                    1px solid rgba(255,255,255,0.08);

        }

        .brand{

            color:white;

            font-size:28px;
            font-weight:700;

        }

        .online{

            color:#4ade80;

            margin-top:5px;

            font-size:13px;

        }

        .logout-btn{

            padding:12px 18px;

            border:none;

            border-radius:14px;

            background:#ef4444;

            color:white;

            font-weight:600;

            cursor:pointer;

        }

        /* CHAT BOX */

        .chat-box{

            flex:1;

            overflow-y:auto;

            padding:25px;

            display:flex;
            flex-direction:column;

            gap:14px;

        }

        .message{

            max-width:72%;

            padding:15px 18px;

            border-radius:18px;

            color:white;

            animation:fadeIn 0.25s ease;

            word-wrap:break-word;

        }

        .self{

            align-self:flex-end;

            background:
                    linear-gradient(
                            135deg,
                            #7c3aed,
                            #4f46e5
                    );

            border-bottom-right-radius:4px;

        }

        .other{

            align-self:flex-start;

            background:
                    linear-gradient(
                            135deg,
                            #06b6d4,
                            #0ea5e9
                    );

            border-bottom-left-radius:4px;

        }

        .sender{

            font-size:11px;

            opacity:0.7;

            margin-bottom:5px;

        }

        /* NOTIFICATIONS */

        .notification{

            align-self:center;

            padding:12px 18px;

            border-radius:50px;

            font-size:13px;

            animation:fadeIn 0.25s ease;

        }

        .join{

            background:
                    rgba(34,197,94,0.15);

            border:
                    1px solid rgba(34,197,94,0.4);

            color:#86efac;

        }

        .leave{

            background:
                    rgba(239,68,68,0.15);

            border:
                    1px solid rgba(239,68,68,0.4);

            color:#fca5a5;

        }

        /* INPUT */

        .input-area{

            padding:20px;

            display:flex;

            gap:15px;

            background:
                    rgba(255,255,255,0.04);

            border-top:
                    1px solid rgba(255,255,255,0.08);

        }

        .input-area input{

            flex:1;

            padding:18px;

            border:none;
            outline:none;

            border-radius:18px;

            background:
                    rgba(255,255,255,0.08);

            color:white;

            font-size:15px;

        }

        .send-btn{

            padding:18px 24px;

            border:none;

            border-radius:18px;

            background:
                    linear-gradient(
                            135deg,
                            #8b5cf6,
                            #4f46e5
                    );

            color:white;

            font-weight:600;

            cursor:pointer;

        }

        @keyframes fadeIn{

            from{
                opacity:0;
                transform:translateY(10px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }

        }

        @media(max-width:700px){

            .header{
                padding:0 15px;
            }

            .chat-box{
                padding:15px;
            }

            .message{
                max-width:85%;
            }

        }

    </style>

</head>
<body>

<div class="chat-container">

    <!-- HEADER -->

    <div class="header">

        <div>

            <div class="brand">
                EchoVerse
            </div>

            <div class="online"
                 id="welcomeText">

            </div>

        </div>

        <button class="logout-btn"
                onclick="logout()">

            Logout

        </button>

    </div>

    <!-- CHAT -->

    <div class="chat-box"
         id="chatBox">

    </div>

    <!-- INPUT -->

    <div class="input-area">

        <input type="text"
               id="messageInput"
               placeholder="Type your message...">

        <button class="send-btn"
                onclick="sendMessage()">

            Send

        </button>

    </div>

</div>

<script>

    let stompClient = null;

    let username =
        sessionStorage.getItem("username");

    // IF USER DIRECTLY OPENS /chat
    // WITHOUT JOINING

    if(!username){

        window.location.href="/";

    }

    // SHOW USERNAME

    document.getElementById(
        "welcomeText"
    ).innerText =
        "Connected as " + username;

    // CONNECT

    function connect(){

        let socket =
            new SockJS('/chat');

        stompClient =
            Stomp.over(socket);

        stompClient.connect(
            {},
            function(){

                // SUBSCRIBE TO CHAT

                stompClient.subscribe(
                    '/topic/messages',
                    function(message){

                        showMessage(
                            JSON.parse(message.body)
                        );

                    }
                );

                // SUBSCRIBE TO NOTIFICATIONS

                stompClient.subscribe(
                    '/topic/notifications',
                    function(notification){

                        showNotification(
                            notification.body
                        );

                    }
                );

                // SEND JOIN NOTIFICATION

                stompClient.send(

                    "/app/notification",
                    {},
                    username + " joined EchoVerse"

                );

            }
        );

    }

    // SEND MESSAGE

    function sendMessage(){

        let content =
            document.getElementById(
                "messageInput"
            ).value;

        if(content.trim() === ""){
            return;
        }

        let chatMessage = {

            sender: username,
            content: content

        };

        stompClient.send(

            "/app/sendMessage",
            {},
            JSON.stringify(chatMessage)

        );

        document.getElementById(
            "messageInput"
        ).value = "";

    }

    // SHOW MESSAGE

    function showMessage(message){

        let chatBox =
            document.getElementById(
                "chatBox"
            );

        let messageDiv =
            document.createElement("div");

        if(message.sender === username){

            messageDiv.classList.add(
                "message",
                "self"
            );

        }
        else{

            messageDiv.classList.add(
                "message",
                "other"
            );

        }

        messageDiv.innerHTML = `

            <div class="sender">
                ${message.sender}
            </div>

            <div>
                ${message.content}
            </div>

        `;

        chatBox.appendChild(
            messageDiv
        );

        chatBox.scrollTop =
            chatBox.scrollHeight;

    }

    // SHOW NOTIFICATION

    function showNotification(text){

        let chatBox =
            document.getElementById(
                "chatBox"
            );

        let note =
            document.createElement("div");

        note.classList.add(
            "notification"
        );

        // JOIN COLOR

        if(text.includes("joined")){

            note.classList.add(
                "join"
            );

            note.innerHTML =
                "🟢 " + text;

        }

        // LEAVE COLOR

        else if(text.includes("left")){

            note.classList.add(
                "leave"
            );

            note.innerHTML =
                "🔴 " + text;

        }

        chatBox.appendChild(note);

        chatBox.scrollTop =
            chatBox.scrollHeight;

    }

    // LOGOUT

    function logout(){

        stompClient.send(

            "/app/notification",
            {},
            username + " left EchoVerse"

        );

        stompClient.disconnect();

        sessionStorage.clear();

        window.location.href="/";

    }

    // ENTER KEY SUPPORT

    document.addEventListener(
        "DOMContentLoaded",
        () => {

            document
                .getElementById(
                    "messageInput"
                )
                .addEventListener(
                    "keypress",
                    function(event){

                        if(event.key === "Enter"){

                            sendMessage();

                        }

                    }
                );

        }
    );

    connect();

</script>

</body>
</html>
